<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>卡冈图雅 · GARGANTUA — 引力透镜黑洞</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23f2b36b' stroke-width='6' stroke-dasharray='118 12'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23000'/%3E%3C/svg%3E">
<style>
  :root{
    --gold:#f2b36b;
    --gold-soft:rgba(242,179,107,.55);
    --ink:rgba(6,8,11,.72);
    --line:rgba(242,179,107,.16);
    --txt:#e9e2d6;
    --dim:#9a917f;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;
    --serif:"Baskerville","Times New Roman","Noto Serif SC","Songti SC",serif;
    --sans:"Inter","SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}
  body{font-family:var(--sans);color:var(--txt);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #gl.dragging{cursor:grabbing}

  /* ---------- top left title ---------- */
  #hud{position:fixed;top:0;left:0;z-index:20;display:flex;align-items:flex-start;gap:16px;
    padding:22px 26px;pointer-events:none;transition:opacity .5s,transform .5s}
  #hud .ring{width:46px;height:46px;margin-top:4px;border-radius:50%;flex:0 0 auto;
    background:
      conic-gradient(from 25deg, transparent 0 72deg, var(--gold) 100deg, rgba(255,255,255,.95) 130deg,
        var(--gold) 160deg, transparent 188deg 360deg),
      radial-gradient(circle at 50% 50%, #000 0 9px, rgba(242,179,107,.22) 10px 12px, transparent 13px);
    -webkit-mask:radial-gradient(circle, transparent 0 9px, #000 10px 16px, transparent 17px);
            mask:radial-gradient(circle, transparent 0 9px, #000 10px 16px, transparent 17px);
    filter:drop-shadow(0 0 14px rgba(242,179,107,.35));animation:hueSpin 14s linear infinite}
  @keyframes hueSpin{to{transform:rotate(360deg)}}
  #hud .words{display:flex;flex-direction:column;gap:4px}
  #hud .brand{font-size:10px;letter-spacing:.52em;color:var(--gold);opacity:.9}
  #hud h1{font-family:var(--serif);font-weight:400;font-size:clamp(20px,2.6vw,34px);
    letter-spacing:.30em;line-height:1.05;text-shadow:0 0 24px rgba(242,179,107,.25)}
  #hud .sub{margin-top:4px;font-size:clamp(10px,1.1vw,12px);letter-spacing:.22em;color:var(--dim)}
  #hud .sub b{color:var(--txt);font-weight:500}

  /* ---------- top right stats ---------- */
  #stats{position:fixed;top:20px;right:24px;z-index:20;text-align:right;font-family:var(--mono);
    font-size:10.5px;letter-spacing:.12em;color:var(--dim);line-height:1.9;
    transition:opacity .5s}
  #stats b{color:var(--gold-soft);font-weight:400}
  #stats .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7adf8f;
    box-shadow:0 0 8px #7adf8f;margin-right:6px;vertical-align:1px}

  /* ---------- control panel ---------- */
  #panel{position:fixed;right:22px;bottom:22px;z-index:30;width:min(296px,calc(100vw - 44px));
    background:linear-gradient(160deg,rgba(16,18,22,.82),rgba(8,10,13,.88));
    border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    transition:opacity .5s,transform .5s;max-height:calc(100vh - 40px);overflow-y:auto;scrollbar-width:thin}
  #panel::-webkit-scrollbar{width:5px}#panel::-webkit-scrollbar-thumb{background:rgba(242,179,107,.25);border-radius:4px}
  #panel h2{font-size:10px;letter-spacing:.34em;color:var(--gold);font-weight:500;margin:2px 0 10px}
  .ctl{display:grid;grid-template-columns:1fr;gap:5px;margin-bottom:12px}
  .ctl .row{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em}
  .ctl .row span{color:var(--dim)}
  .ctl .row b{font-family:var(--mono);font-weight:400;color:var(--txt);font-size:10.5px}
  input[type=range]{width:100%;height:3px;appearance:none;-webkit-appearance:none;background:
    linear-gradient(90deg,var(--gold) var(--fill,50%),rgba(255,255,255,.10) var(--fill,50%));
    border-radius:3px;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--gold);border:2px solid #17110a;box-shadow:0 0 10px rgba(242,179,107,.55)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--gold);
    border:2px solid #17110a;box-shadow:0 0 10px rgba(242,179,107,.55)}
  .seg{display:grid;grid-auto-flow:column;gap:4px;margin-bottom:14px}
  .seg button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);
    font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;padding:6px 0;border-radius:8px;cursor:pointer;
    transition:all .18s}
  .seg button.on{color:#17110a;background:linear-gradient(180deg,#ffd9a1,#e8a255);border-color:#f2b36b;
    box-shadow:0 0 14px rgba(242,179,107,.35);font-weight:600}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .btns button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);
    font-family:var(--sans);font-size:11px;letter-spacing:.14em;padding:8px 6px;border-radius:9px;cursor:pointer;
    transition:all .18s}
  .btns button:hover{background:rgba(242,179,107,.12);border-color:rgba(242,179,107,.4)}
  .btns button.on{color:var(--gold);border-color:rgba(242,179,107,.55);background:rgba(242,179,107,.10)}

  /* ---------- bottom hint ---------- */
  #hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:15;
    font-size:10.5px;letter-spacing:.2em;color:var(--dim);pointer-events:none;
    text-shadow:0 2px 8px #000;transition:opacity .5s}
  #hint b{color:var(--gold-soft);font-weight:400}

  /* ---------- error ---------- */
  #error{position:fixed;inset:0;z-index:99;display:none;place-items:center;background:#050607;padding:30px}
  #error.show{display:grid}
  #error div{max-width:560px;font-size:13px;line-height:2;color:var(--dim);font-family:var(--mono);white-space:pre-wrap}

  body.ui-hidden #hud,body.ui-hidden #stats,body.ui-hidden #panel,body.ui-hidden #hint{opacity:0;pointer-events:none}
  body.ui-hidden #panel{transform:translateY(14px)}
  body.ui-hidden #hud{transform:translateY(-14px)}

  @media (max-width:720px){
    #panel{right:10px;bottom:10px;width:min(272px,calc(100vw - 20px));padding:14px 14px 10px}
    #hud{padding:14px 16px}
    #stats{top:14px;right:16px}
    #hint{bottom:auto;top:auto;left:auto;right:10px;bottom:calc(50% + 0px);display:none}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<header id="hud">
  <div class="ring" aria-hidden="true"></div>
  <div class="words">
    <div class="brand">INTERSTELLAR</div>
    <h1>卡冈图雅 · GARGANTUA</h1>
    <div class="sub">SCHWARZSCHILD 光子测地线 · 相对论多普勒盘 · 实时引力透镜 <b>| 2014</b></div>
  </div>

<div id="stats">
  <span><span class="dot"></span>深空遥测</span><br>

<aside id="panel">

    <input id="cDisk" type="range" min="0" max="3" step="0.05" value="1"></label>

  <label class="ctl"><span class="row"><span>吸积盘转速</span><b id="vSpin">0.55</b></span>
    <input id="cSpin" type="range" min="-2" max="2" step="0.05" value="0.55"></label>

  <label class="ctl"><span class="row"><span>盘面色温</span><b id="vTemp">1.00</b></span>
    <input id="cTemp" type="range" min="0.7" max="1.4" step="0.01" value="1"></label>

  <label class="ctl"><span class="row"><span>恒星背景</span><b id="vStar">1.00</b></span>

  <label class="ctl"><span class="row"><span>光晕强度</span><b id="vBloom">1.00</b></span>
    <input id="cBloom" type="range" min="0" max="2.2" step="0.05" value="1"></label>

  <label class="ctl"><span class="row"><span>胶片颗粒</span><b id="vGrain">0.14</b></span>
    <input id="cGrain" type="range" min="0" max="1" step="0.01" value="0.14"></label>

  <div class="btns">
    <button id="bCruise" class="on">巡航中</button>
    <button id="bReset">重置视角</button>
    <button id="bFrame">电影画幅</button>
    <button id="bAudio">开启音效</button>
    <button id="bFull">全屏</button>
    <button id="bHide">隐藏界面</button>
  </div>

<div id="hint"><b>拖拽</b> 环绕 · <b>滚轮/双指</b> 推拉 · <b>双击</b> 隐藏界面 · <b>R</b> 重置 · <b>F</b> 全屏</div>

<div id="error"><div id="errorText"></div></div>

<script>
'use strict';
(function(){
  const $ = id => document.getElementById(id);
  const canvas = $('gl');

  /* ================= WebGL ================= */
  const attrs = {antialias:false, alpha:false, depth:false, stencil:false,
                 preserveDrawingBuffer:false, powerPreference:'high-performance'};
  let gl = canvas.getContext('webgl2', attrs);
  let isGL2 = !!gl;
  if (!gl) { gl = canvas.getContext('webgl', attrs) || canvas.getContext('experimental-webgl', attrs); }
  if (!gl) {
    $('error').classList.add('show');
    $('errorText').textContent = '无法初始化 WebGL。\n\n此页面需要支持 WebGL 的现代浏览器(Chrome / Edge / Firefox / Safari)。\n请开启硬件加速后重试。';
    return;
  }
  let isHDR = isGL2;   // WebGL2 核心支持 RGBA16F 可渲染纹理
  let lossNotice = false;
  canvas.addEventListener('webglcontextlost', e=>{ e.preventDefault(); lossNotice=true; });

  function compile(type, src){
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
      const log = gl.getShaderInfoLog(sh);
      gl.deleteShader(sh);
      throw new Error(log);
    }
    return sh;
  }
  function link(vsSrc, fsSrc){
    const vs = compile(gl.VERTEX_SHADER, vsSrc);
    const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
    const p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, fs);
    gl.linkProgram(p);
    gl.deleteShader(vs); gl.deleteShader(fs);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)){
      const log = gl.getProgramInfoLog(p);
      gl.deleteProgram(p);
      throw new Error(log);
    }
    return p;
  }
  function uniformMap(p, names){
    const m = {};
    for (const n of names) m[n] = gl.getUniformLocation(p, n);
    return m;
  }

  /* ---------- shader sources ---------- */
  const vertexSrc = isGL2 ? `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`
: `precision highp float;
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

  const sceneBody = `
uniform vec2  uResolution;
uniform float uTime;
uniform float uAspect;
uniform float uFovTan;
uniform vec3  uCamPos;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform vec3  uCamFwd;
uniform float uSteps;
uniform float uDt;
uniform float uDiskBright;
uniform float uDiskSpin;
uniform float uTempShift;
uniform float uStarBright;
uniform float uSceneScale;

#define MAX_STEPS 320
const float DISK_IN  = 2.55;
const float DISK_OUT = 11.0;
const float ESCAPE_R = 70.0;
const float PI = 3.14159265;

/* ---------- hash & noise ---------- */
float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float hash13(vec3 p){
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
vec3 hash33(vec3 p){
  p = fract(p * vec3(0.7974, 0.4843, 0.3713));
  p += dot(p, p.yxz + 33.33);
  return fract((p.xxy + p.yxx) * p.zyx);
}
float vnoise(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1.0,0.0)), u.x),
             mix(hash21(i + vec2(0.0,1.0)), hash21(i + vec2(1.0,1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0;
  float a = 0.5;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 4; i++){
    v += a * vnoise(p);
    p = rot * p * 2.03 + vec2(3.7, 1.9);
    a *= 0.5;
  }
  return v;
}
float fbm3(vec2 p){
  float v = 0.0;
  float a = 0.5;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 3; i++){
    v += a * vnoise(p);
    p = rot * p * 2.05 + vec2(5.1, 2.3);
    a *= 0.5;
  }
  return v;
}

/* ---------- Planckian-ish colour ---------- */
vec3 blackbody(float x){
  x = clamp(x, 0.0, 2.2);
  vec3 c;
  if (x < 0.30)      c = mix(vec3(0.82,0.09,0.02), vec3(1.00,0.30,0.07), x/0.30);
  else if (x < 0.60) c = mix(vec3(1.00,0.30,0.07), vec3(1.00,0.60,0.26), (x-0.30)/0.30);
  else if (x < 0.95) c = mix(vec3(1.00,0.60,0.26), vec3(1.00,0.84,0.58), (x-0.60)/0.35);
  else if (x < 1.35) c = mix(vec3(1.00,0.84,0.58), vec3(1.00,0.97,0.90), (x-0.95)/0.40);
  else               c = mix(vec3(1.00,0.97,0.90), vec3(0.72,0.86,1.20), min((x-1.35)*0.9, 1.0));
  return c;
}

/* ---------- accretion disk at an equatorial-plane crossing ---------- */
vec3 shadeDisk(vec3 p, vec3 rd, float r){
  float phi = atan(p.z, p.x);
  float om  = pow(r, -1.5);                          // Keplerian differential rotation
  float ang = phi + uDiskSpin * uTime * om * 2.4;    // shear winds streaks into spirals
  vec2 q = vec2(ang * r * 1.25, r * 0.55);

  float n1 = fbm(q * 0.45);
  float n2 = fbm(q * 0.15 + n1 * 1.6);
  float detail = fbm(vec2(q.x * 1.05 + n2 * 2.4, q.y * 1.7 - uTime * 0.018));

  float bands = 0.55 + 0.45 * sin(ang * r * 0.17 + n2 * 5.0 + r * 0.85);
  float pat = 0.55 * bands + 0.45 * detail;

  float inner = smoothstep(DISK_IN - 0.45, DISK_IN + 0.55, r);
  float outer = 1.0 - smoothstep(DISK_OUT - 2.4, DISK_OUT + 1.2, r);
  float edge  = exp(-max(r - 3.05, 0.0) * 0.28);
  float mask  = inner * outer * (0.32 + 0.68 * pat) * edge;
  if (mask <= 0.001) return vec3(0.0);

  /* relativistic beaming: Keplerian orbital velocity, Doppler + gravitational redshift */
  vec3 orbDir = normalize(vec3(-p.z, 0.0, p.x));
  float beta2 = min(1.0 / (2.0 * max(r, 1.05) - 2.0), 0.94);
  float beta  = sqrt(max(beta2, 0.0));
  float gamma = 1.0 / sqrt(max(1.0 - beta2, 0.02));
  float cosA  = -dot(rd, orbDir);                    // emitter -> observer direction
  float delta = 1.0 / max(gamma * (1.0 - beta * cosA), 0.02);
  float grav  = sqrt(max(1.0 - 1.0 / max(r, 1.05), 0.30));
  delta = clamp(delta * grav, 0.06, 9.0);

  float boost = min(pow(delta, 3.0), 60.0);
  float t = pow(3.05 / max(r, 1.5), 0.72) * uTempShift;
  t *= (0.72 + 0.50 * pat);
  t *= delta;

  vec3 col = blackbody(t);
  return col * (uDiskBright * 1.55 * mask * boost);
}

/* ---------- lensed deep-space background ---------- */
vec3 renderBackground(vec3 dir){
  vec3 gn = normalize(vec3(0.32, 1.0, 0.28));
  vec3 gx = normalize(cross(gn, vec3(0.0, 1.0, 0.0)));
  vec3 gz = normalize(cross(gx, gn));
  float lat = dot(dir, gn);
  float bandW = exp(-pow(lat * 3.1, 2.0));

  vec3 star = vec3(0.0);
  float flare = 0.0;
  for (int L = 0; L < 2; L++){
    float sc = (L == 0) ? 24.0 : 52.0;
    vec3 sp = dir * sc;
    vec3 id = floor(sp);
    vec3 fr = fract(sp);
    float h = hash13(id);
    float dens = mix(0.035, 0.22, bandW) * ((L == 0) ? 0.9 : 1.25);
    if (h < dens){
      vec3 rnd = hash33(id);
      vec3 q = fract(fr - rnd) - 0.5;
      float d = length(q);
      float size = mix(0.0022, 0.0095, fract(h * 13.71));
      float s = 1.0 - smoothstep(size * 0.12, size, d);
      if (s > 0.0){
        float tw = 0.72 + 0.28 * sin(uTime * (1.0 + fract(h * 5.13) * 3.0) + h * 61.0);
        float bright = mix(0.35, 1.0, fract(h * 7.31));
        vec3 scolor = mix(vec3(0.72,0.84,1.08), vec3(1.0,0.82,0.62), fract(h * 3.17));
        star += scolor * s * bright * tw * (0.45 + 0.55 * (1.0 - abs(lat)));
        flare = max(flare, s * bright);
      }
    }
  }
  /* diffraction spikes on the brightest stars */
  vec2 sx = vec2(dot(dir, gx), dot(dir, gz));
  float spike = pow(max(1.0 - abs(sx.x) * 90.0, 0.0), 3.0)
              + pow(max(1.0 - abs(sx.y) * 90.0, 0.0), 3.0)
              + pow(max(1.0 - abs(dot(sx, normalize(vec2(0.707, 0.707)))) * 120.0, 0.0), 3.0)
              + pow(max(1.0 - abs(dot(sx, normalize(vec2(0.707,-0.707)))) * 120.0, 0.0), 3.0);
  star += vec3(0.85, 0.92, 1.05) * spike * flare * 1.1;

  /* galactic haze, warm dust lanes, cool starlight */
  vec2 gp = vec2(dot(dir, gx), dot(dir, gz));
  float bm = exp(-pow(lat * 2.6, 2.0));
  float n1 = fbm3(gp * 2.1 + uTime * 0.005 + fbm3(gp * 3.4 - uTime * 0.009));
  float n2 = fbm3(gp * 4.3 - uTime * 0.007);
  float dust = smoothstep(0.48, 0.80, fbm3(gp * 2.5 + 7.3));
  vec3 neb = vec3(0.17, 0.095, 0.045) * n1 * bm * 1.7
           + vec3(0.035, 0.075, 0.14)  * n2 * bm * 1.5;
  neb *= (1.0 - dust * 0.85);
  neb *= uStarBright;

  vec3 col = vec3(0.0015, 0.0025, 0.0045) + star * uStarBright * 1.35 + neb;
  return col;
}

void main(){
  vec2 uv  = gl_FragCoord.xy / uResolution;
  vec2 ndc = uv * 2.0 - 1.0;
  ndc.x *= uAspect;
  vec3 rd = normalize(ndc.x * uCamRight + ndc.y * uCamUp + uFovTan * uCamFwd);
  vec3 ro = uCamPos;

  /* photon geodesic, backward integration in Schwarzschild spacetime (rs = 1) */
  vec3 pos = ro;
  vec3 vel = rd;
  float h2 = dot(cross(pos, vel), cross(pos, vel));
  float dt = uDt * pow(max(dot(pos, pos), 0.0), 0.75);

  vec3 diskCol = vec3(0.0);
  bool horizon = false;
  int crossings = 0;

  for (int i = 0; i < MAX_STEPS; i++){
    if (float(i) >= uSteps) break;

    vec3 prevPos  = pos;
    vec3 prevVel  = vel;
    float prevY   = pos.y;
    float r2      = dot(pos, pos);
    float r       = sqrt(max(r2, 1e-8));

    if (r < 0.97){ horizon = true; break; }
    if (r > ESCAPE_R && dot(pos, vel) > 0.0) break;

    cruise:true, cruiseT0:0, cYaw0:0.55, cPitch0:0.12, cDist0:9.2,

  /* ---------- UI bindings ---------- */
  function bindSlider(id, key, fmt){

    const set = ()=>{ S[key] = parseFloat(el.value); out.textContent = fmt(S[key]);

  bindSlider('cDisk','disk', v=>v.toFixed(2));
  bindSlider('cSpin','spin', v=>v.toFixed(2));
  bindSlider('cTemp','temp', v=>v.toFixed(2));
  bindSlider('cStar','star', v=>v.toFixed(2));
  bindSlider('cBloom','bloom',v=>v.toFixed(2));
  bindSlider('cGrain','grain',v=>v.toFixed(2));

  $('bReset').addEventListener('click', ()=>{ setCruise(true); });
  $('bFrame').addEventListener('click', ()=>{
    S.letterbox = 1 - S.letterbox;
    $('bFrame').classList.toggle('on', !!S.letterbox);
  });
  $('bFull').addEventListener('click', ()=>{
    if (document.fullscreenElement) document.exitFullscreen();

  });
  $('bHide').addEventListener('click', ()=> document.body.classList.toggle('ui-hidden'));
  document.addEventListener('keydown', e=>{
    if (e.key === 'f' || e.key === 'F') $('bFull').click();
    if (e.key === 'r' || e.key === 'R') setCruise(true);
    if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('ui-hidden');

  /* ---------- orbit controls ---------- */
