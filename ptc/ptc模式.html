<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GARGANTUA · 卡冈图雅黑洞 — 星际穿越致敬</title>
<style>
  :root{
    --accent: #e6a566;
    --accent-dim: rgba(230,165,102,.55);
    --ink: rgba(238,233,224,.92);
    --ink-dim: rgba(226,216,200,.55);
    --panel-bg: rgba(10,9,8,.55);
    --panel-line: rgba(255,255,255,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}
  body{
    font-family:"Futura","Century Gothic","Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    user-select:none;-webkit-user-select:none;
    touch-action:none;cursor:grab;
  }
  body.dragging{cursor:grabbing}
  #glcanvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}

  /* ---------- 标题 ---------- */
  .title{position:fixed;top:5vh;left:0;right:0;text-align:center;pointer-events:none;z-index:6}
  .title h1{
    font-size:clamp(26px,4.4vw,56px);font-weight:200;
    letter-spacing:.42em;text-indent:.42em;
    color:rgba(241,236,226,.96);
    text-shadow:0 0 26px rgba(255,178,106,.38),0 0 80px rgba(255,150,60,.18);
  }
  .title .sub{
    margin-top:10px;font-size:clamp(10px,1.02vw,13px);
    letter-spacing:.36em;text-indent:.36em;
    color:var(--ink-dim);text-transform:uppercase;
  }

  /* ---------- 底部提示 ---------- */
  #hint{
    position:fixed;left:0;right:0;bottom:2.6vh;text-align:center;
    font-size:12px;letter-spacing:.18em;color:var(--ink-dim);
    pointer-events:none;z-index:6;transition:opacity .6s;
  }
  #hint.hidden{opacity:0}
  #hint b{color:var(--accent);font-weight:400}

  /* ---------- 设置面板 ---------- */
  #panel{
    position:fixed;right:18px;top:50%;transform:translateY(-50%);
    width:212px;padding:16px 16px 14px;
    background:var(--panel-bg);
    border:1px solid var(--panel-line);border-radius:12px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    z-index:7;font-size:12px;
    transition:opacity .5s, transform .5s;
  }
  #panel.hidden{opacity:0;pointer-events:none;transform:translateY(-50%) translateX(12px)}
  #panel .p-title{
    font-size:11px;letter-spacing:.4em;color:var(--accent);
    text-align:center;margin-bottom:12px;
  }
  #panel .row{display:flex;align-items:center;justify-content:space-between;margin:9px 0;gap:8px}
  #panel .row>span{color:var(--ink-dim);letter-spacing:.08em;white-space:nowrap}
  .seg{display:flex;border:1px solid var(--panel-line);border-radius:7px;overflow:hidden}
  .seg button{
    background:transparent;border:none;color:var(--ink-dim);
    font-size:11px;padding:4px 9px;cursor:pointer;letter-spacing:.1em;
    font-family:inherit;
  }
  .seg button.on{background:rgba(230,165,102,.18);color:var(--accent)}
  .seg button+button{border-left:1px solid var(--panel-line)}
  button.toggle{
    background:rgba(255,255,255,.06);border:1px solid var(--panel-line);border-radius:7px;
    color:var(--ink-dim);font-size:11px;padding:4px 10px;cursor:pointer;letter-spacing:.12em;
    font-family:inherit;min-width:40px;
  }
  button.toggle.on{background:rgba(230,165,102,.18);color:var(--accent);border-color:var(--accent-dim)}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:96px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent),rgba(230,165,102,.25));outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--accent);border:none;cursor:pointer;
  }
  #panel .note{
    margin-top:12px;padding-top:10px;border-top:1px solid var(--panel-line);
    font-size:10px;line-height:1.7;color:rgba(226,216,200,.4);letter-spacing:.1em;text-align:center;
  }

  /* ---------- 加载遮罩 ---------- */
  #loader{
    position:fixed;inset:0;z-index:20;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .8s;
  }
  #loader.gone{opacity:0;pointer-events:none}
  #loader .spin{
    width:34px;height:34px;border-radius:50%;
    border:1px solid rgba(230,165,102,.25);
    border-top-color:var(--accent);
    animation:rot 1.1s linear infinite;
  }
  @keyframes rot{to{transform:rotate(360deg)}}
  #loader .txt{font-size:11px;letter-spacing:.5em;text-indent:.5em;color:var(--ink-dim)}
  #loader .err{
    display:none;max-width:520px;text-align:center;font-size:13px;line-height:2;
    color:#e8b58a;letter-spacing:.06em;padding:0 24px;
  }

  @media (max-width:760px){
    #panel{right:10px;width:188px;padding:12px 12px 10px}
    #hint{font-size:10px;bottom:1.8vh}
    .title{top:3.5vh}
  }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>

<div class="title">
  <h1>GARGANTUA</h1>
  <div class="sub">卡冈图雅 · 星际穿越 黑洞模拟</div>
</div>

<div id="hint">
  <b>拖拽</b> 旋转视角 &nbsp;·&nbsp; <b>滚轮</b> 推近拉远 &nbsp;·&nbsp; <b>双击</b> 自动运镜 &nbsp;·&nbsp; 右侧面板调参
</div>

<div id="panel">
  <div class="p-title">设 置</div>
  <div class="row"><span>画质</span>
    <div class="seg" id="segQ">
      <button data-q="0.5">低</button>
      <button data-q="0.75" class="on">中</button>
      <button data-q="1">高</button>
    </div>
  </div>
  <div class="row"><span>多普勒强度</span>
    <input type="range" id="doppler" min="0" max="1" step="0.01" value="0.72">
  </div>
  <div class="row"><span>自动运镜</span>
    <button class="toggle on" id="btnAuto">开</button>
  </div>
  <div class="row"><span>抗锯齿累积</span>
    <button class="toggle on" id="btnAA">开</button>
  </div>
  <div class="row"><span>视角</span>
    <button class="toggle" id="btnReset">重置</button>
  </div>
  <div class="note">史瓦西度规测地线光线追踪<br>引力透镜 · 相对论多普勒 · 光子环</div>
</div>

<div id="loader">
  <div class="spin"></div>
  <div class="txt">正在初始化时空曲率</div>
  <div class="err" id="errmsg"></div>
</div>

<!-- ============ GLSL 源码（type=x-shader 不执行，仅供 JS 读取） ============ -->
<script id="fs-trace" type="x-shader">
#version 300 es
precision highp float;

uniform vec2  uResolution;
uniform vec3  uCamPos;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform vec3  uCamFwd;
uniform float uTanHalfFov;
uniform float uAspect;
uniform float uTime;
uniform float uDoppler;   // 多普勒强度（电影做了艺术化弱化，0=关闭 1=物理完整）
uniform vec2  uJitter;
uniform float uBlend;
uniform float uDebug;   // 0 正常 / 1 调试（捕获红 盘绿 逃逸蓝）
uniform sampler2D uPrev;

out vec4 fragColor;

/* ---------- 常量（G = c = M = 1，史瓦西半径 = 2） ---------- */
#define DISK_IN   5.5     // 盘内缘（紧贴阴影半径 5.2 之外，形成阴影边缘炽热环）
#define DISK_OUT  42.0
#define DISK_H    0.42    // 盘半厚度
#define R_ESCAPE  30.0
#define MAX_STEPS 640
#define DPHI      0.06

/* ---------- hash / 噪声 ---------- */
float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float hash13(vec3 p){
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}
vec3 hash31(vec3 p){
  p = fract(p * vec3(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yzx + 33.33);
  return fract((p.xxy + p.yxx) * p.zyx);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  float a = hash12(i);
  float b = hash12(i+vec2(1.0,0.0));
  float c = hash12(i+vec2(0.0,1.0));
  float d = hash12(i+vec2(1.0,1.0));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for(int i=0;i<4;i++){
    v += a * vnoise(p);
    p = m * p;
    a *= 0.5;
  }
  return v;
}

/* ---------- 黑体颜色（Neil Bartlett 拟合，K → sRGB） ---------- */
vec3 blackbody(float t){
  t = clamp(t, 1000.0, 40000.0) / 100.0;
  float r,g,b;
  if(t <= 66.0){
    r = 1.0;
    g = 0.3900815787690196*log(t) - 0.6318414437886275;
  } else {
    r = 1.292936186062745*pow(t-60.0, -0.1332047592);
    g = 1.129890860895294*pow(t-60.0, -0.0755148492);
  }
  if(t >= 66.0) b = 1.0;
  else if(t <= 19.0) b = 0.0;
  else b = 0.543206789110196*log(t-10.0) - 1.19625408914;
  return clamp(vec3(r,g,b), 0.0, 1.0);
}

/* ---------- 背景星空与星云 ---------- */
float starField(vec3 dir, float scale, float threshold, float sharpness){
  vec3 p = dir * scale;
  vec3 id = floor(p);
  float s = 0.0;
  for(int x=-1;x<=1;x++)
  for(int y=-1;y<=1;y++)
  for(int z=-1;z<=1;z++){
    vec3 cell = id + vec3(float(x),float(y),float(z));
    float h = hash13(cell);
    if(h > threshold){
      vec3 center = cell + 0.5 + (hash31(cell+7.7)-0.5)*0.6;
      float d = length(p - center);
      float mag = 0.4 + 1.6*hash13(cell+3.1);
      s += exp(-d*d*sharpness) * mag;
    }
  }
  return s;
}
vec3 background(vec3 dir){
  // 弥漫星云（暖冷交织，暗弱）
  vec2 q = vec2(dir.x + dir.y*0.35, dir.z - dir.y*0.22);
  float neb = fbm(q*0.72 + vec2(0.4, 1.9)) * 0.55 + fbm(q*1.9 - vec2(2.1, 0.7)) * 0.3;
  vec3 col = vec3(0.022, 0.021, 0.020);
  col += vec3(0.10, 0.058, 0.028) * neb * neb * 2.6;
  col += vec3(0.030, 0.040, 0.058) * fbm(dir.xy*1.1 + dir.yz*0.7) * 0.5;
  // 星点（两层）
  float stars  = starField(dir, 14.0, 0.9978, 900.0);
  float stars2 = starField(dir, 55.0, 0.9995, 2600.0);
  col += vec3(0.72, 0.70, 0.65) * stars * 1.5;
  col += vec3(0.85, 0.83, 0.78) * stars2 * 1.9;
  return col;
}

/* ---------- 吸积盘程序化纹理 ---------- */
float diskTexture(float r, float phi, float time){
  float Omega = pow(r, -1.5);
  float shear = phi - Omega * time * 1.9;        // 共转坐标（开普勒剪切）
  vec2 p = vec2(r*0.32, shear*3.2);
  float n = 0.0;
  n += fbm(p) * 0.62;
  n += fbm(p*3.3 + vec2(11.7, 3.1)) * 0.27;
  n += fbm(p*11.0 + vec2(5.3, 8.9)) * 0.11;
  float fil = fbm(vec2(r*0.5, shear*14.0 + r*1.3));  // 细丝
  float radial = pow(r/DISK_IN, -1.25);              // 径向衰减
  float rim = 1.0 + 2.2*exp(-(r-DISK_IN)*0.75);      // 内缘灼热
  return radial * (0.30 + 0.70*n) * (0.72 + 0.28*fil) * rim;
}

/* ---------- 追踪结果 ---------- */
struct Hit {
  float type;    // 0 捕获 / 1 盘 / 2 逃逸
  float r;
  float phiOrb;  // 轨道平面内方位角
  vec3  e1, e2;  // 轨道平面基
  vec3  bgDir;
  float b;       // 碰撞参数（守恒量）
  float gMix;    // 多普勒因子（调试用）
  float lum;     // 盘亮度（调试用）
};

/* ---------- 测地线追踪 ----------
   轨道平面由 e1=ro/|ro| 与光线切向 e2 张成；
   积分光子轨道方程 d²u/dφ² = -u + 1.5u²（u = 1/r）。 */
Hit trace(vec3 ro, vec3 rd){
  Hit h;
  h.type = 2.0; h.bgDir = rd; h.r = 0.0; h.phiOrb = 0.0; h.b = 0.0; h.gMix = 1.0; h.lum = 0.0;
  float r0 = length(ro);
  vec3 e1 = ro / r0;
  vec3 e2 = rd - dot(rd, e1)*e1;
  float tang = length(e2);
  if(tang < 1e-4){
    // 径向特例：向内必捕获，向外必逃逸
    h.type = (dot(rd, e1) > 0.0) ? 2.0 : 0.0;
    return h;
  }
  e2 /= tang;
  h.e1 = e1; h.e2 = e2;

  float u = 1.0 / r0;
  float dudp = -u * dot(rd, e1) / tang;
  float b2 = u*u + dudp*dudp - 2.0*u*u*u;
  if(b2 <= 0.0){ h.type = 0.0; return h; }
  h.b = inversesqrt(b2);

  // 解析判据：b < 3*sqrt(3) 的光线越过光子势垒（b2 变量存的是 1/b²）。
  // 初始径向向内 → 必被捕获（阴影边界精确）；向外 → 必逃逸。
  if(b2 > 1.0/27.0){
    if(dot(rd, e1) < 0.0){ h.type = 0.0; return h; }
    h.type = 2.0; h.bgDir = rd; return h;
  }

  float phi = 0.0;
  bool haveDisk = false;
  float diskR = 0.0, diskPhi = 0.0;

  for(int i=0;i<MAX_STEPS;i++){
    // RK4
    float k1u = dudp;
    float k1v = -u + 1.5*u*u;
    float ua = u + 0.5*DPHI*k1u;
    float k2u = dudp + 0.5*DPHI*k1v;
    float k2v = -ua + 1.5*ua*ua;
    float ub = u + 0.5*DPHI*k2u;
    float k3u = dudp + 0.5*DPHI*k2v;
    float k3v = -ub + 1.5*ub*ub;
    float uc = u + DPHI*k3u;
    float k4u = dudp + DPHI*k3v;
    float k4v = -uc + 1.5*uc*uc;

    float uNew    = u    + DPHI/6.0*(k1u + 2.0*k2u + 2.0*k3u + k4u);
    float dudpNew = dudp + DPHI/6.0*(k1v + 2.0*k2v + 2.0*k3v + k4v);

    // 落入视界
    if(uNew > 0.495){ h.type = 0.0; return h; }

    // 盘命中（最近交点；|y|<DISK_H 且 r ∈ [DISK_IN, DISK_OUT]）
    if(!haveDisk){
      float uMid = 0.5*(u + uNew);
      float rMid = 1.0/uMid;
      float phiMid = phi + 0.5*DPHI;
      float y = rMid * (cos(phiMid)*e1.y + sin(phiMid)*e2.y);
      if(abs(y) < DISK_H && rMid > DISK_IN && rMid < DISK_OUT){
        haveDisk = true; diskR = rMid; diskPhi = phiMid;
      }
    }

    // 逃逸到远处（超过逃逸半径且向外；b>3√3 光线已越过势垒，单调向外）
    if(uNew < 1.0/max(R_ESCAPE, 1.3*r0) && dudpNew < 0.0){
      float phiE = phi + DPHI;
      float rE = 1.0/uNew;
      float vtOverVr = -1.0/(rE*dudpNew);
      vec3 erE = cos(phiE)*e1 + sin(phiE)*e2;
      vec3 etE = -sin(phiE)*e1 + cos(phiE)*e2;
      h.bgDir = normalize(erE + vtOverVr*etE);
      if(haveDisk){ h.type = 1.0; h.r = diskR; h.phiOrb = diskPhi; }
      else h.type = 2.0;
      return h;
    }

    u = uNew; dudp = dudpNew; phi += DPHI;
  }
  // 步数耗尽：仍困在光子球附近视为捕获
  if(u > 0.15){ h.type = 0.0; return h; }
  h.type = 2.0; h.bgDir = rd;
  return h;
}

/* ---------- 盘着色（相对论多普勒 + 黑体） ---------- */
vec3 shadeDisk(inout Hit h, float time){
  vec3 P = h.r * (cos(h.phiOrb)*h.e1 + sin(h.phiOrb)*h.e2);
  float phiDisk = atan(P.z, P.x);

  // 开普勒角速度与洛伦兹因子
  float Omega = pow(h.r, -1.5);
  float ut = inversesqrt(max(1.0 - 3.0/h.r, 0.04));
  // 光子角动量在盘法向(y)上的投影：轨道平面法向 = e1 × e2
  vec3 n = cross(h.e1, h.e2);
  float by = -h.b * n.y;  // 亮侧在画面左侧（匹配电影 Gargantua 构图）
  // 观测能量 / 发射能量
  // 电影化处理：引力红移弱化（盘整体更亮更均匀）、多普勒增强（亮侧更亮），
  // 参考《星际穿越》团队对 Gargantua 的艺术化亮度平衡。
  float utEff = mix(ut, 1.0, 0.45);
  float g = 1.0 / (utEff * (1.0 - by * Omega * 1.3));
  g = clamp(g, 0.3, 3.2);
  float gMix = mix(1.0, g, uDoppler);
  gMix = clamp(gMix, 0.58, 1.65);
  h.gMix = gMix;

  float T = 6900.0 * pow(h.r / DISK_IN, -0.55);
  vec3 col = blackbody(T * gMix);
  float tex = diskTexture(h.r, phiDisk, time);
  float lum = pow(gMix, 2.2) * tex;
  h.lum = lum;
  return col * lum;
}

/* ---------- 主函数 ---------- */
void main(){
  vec2 ndc = (gl_FragCoord.xy + 0.5) / uResolution * 2.0 - 1.0;
  ndc += uJitter * 2.0;
  ndc.x *= uAspect;
  vec3 rd = normalize(uCamFwd + ndc.x*uTanHalfFov*uCamRight + ndc.y*uTanHalfFov*uCamUp);
  vec3 ro = uCamPos;

  Hit h = trace(ro, rd);
  vec3 col;
  if(h.type < 0.5){
    col = vec3(0.0);                    // 事件视界：绝对黑
  } else if(h.type < 1.5){
    col = shadeDisk(h, uTime);
  } else {
    col = background(h.bgDir);
  }
  if(uDebug > 3.5){
    // 盘亮度灰度：黑=暗
    if(h.type > 0.5 && h.type < 1.5) col = vec3(h.lum);
    else col = vec3(0.0);
  } else if(uDebug > 2.5){
    // 命中半径图：r 小(内缘)偏白，r 大(外缘)偏红
    if(h.type > 0.5 && h.type < 1.5){
      float t = clamp((h.r - DISK_IN) / (18.0 - DISK_IN), 0.0, 1.0);
      col = vec3(0.35 + 0.65*t, 0.15 + 0.5*(1.0-t), 0.05);
    } else col = vec3(0.0, 0.0, 0.0);
  } else if(uDebug > 1.5){
    // gMix 图：蓝移(g>1)偏绿亮，红移(g<1)偏红
    if(h.type > 0.5 && h.type < 1.5) col = vec3(2.0 - h.gMix, h.gMix, 0.0) * 0.55;
    else col = vec3(0.0, 0.0, 0.0);
  } else if(uDebug > 0.5){
    if(h.type < 0.5) col = vec3(1.0, 0.0, 0.0);
    else if(h.type < 1.5) col = vec3(0.0, 1.0, 0.0);
    else col = vec3(0.0, 0.0, 1.0);
  }

  vec3 prev = texture(uPrev, gl_FragCoord.xy / uResolution).rgb;
  col = mix(prev, col, uBlend);
  fragColor = vec4(col, 1.0);
}
</script>
<script id="fs-bright" type="x-shader">
#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform vec2 uRes;
out vec4 fragColor;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 c = texture(uScene, uv).rgb;
  float l = max(c.r, max(c.g, c.b));
  float w = smoothstep(0.85, 2.4, l);      // 亮部软阈值
  fragColor = vec4(c * w, 1.0);
}
</script>
<script id="fs-blur" type="x-shader">
#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uDir;
uniform vec2 uRes;
out vec4 fragColor;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 px = uDir / uRes;
  vec3 c = texture(uTex, uv).rgb * 0.227027;
  c += (texture(uTex, uv + px*1.3846).rgb + texture(uTex, uv - px*1.3846).rgb) * 0.316216;
  c += (texture(uTex, uv + px*3.2308).rgb + texture(uTex, uv - px*3.2308).rgb) * 0.070270;
  fragColor = vec4(c, 1.0);
}
</script>
<script id="fs-composite" type="x-shader">
#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform vec2 uRes;        // canvas 输出分辨率
uniform vec2 uSceneRes;   // 内部渲染分辨率
uniform float uTime;
uniform float uFrame;
out vec4 fragColor;

vec3 aces(vec3 x){
  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);
}
float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 c = uv - 0.5;
  float r2 = dot(c, c);

  // 轻微径向色差（电影镜头感）
  vec2 off = c * (1.0 + 3.0*r2) * 1.6 / uSceneRes;
  vec3 col;
  col.r = texture(uScene, uv + off).r;
  col.g = texture(uScene, uv).g;
  col.b = texture(uScene, uv - off).b;

  // bloom 柔光
  vec3 bloom = texture(uBloom, uv).rgb;
  col += bloom * 0.9;

  // 曝光
  col *= 1.35;

  // ACES 色调映射
  col = aces(col);

  // 胶片颗粒
  float g = hash12(uv * uRes + vec2(uFrame*1.37, uFrame*0.71));
  col += (g - 0.5) * 0.02;

  // 暗角
  float vig = smoothstep(0.85, 0.25, length(c) * 1.08);
  col *= mix(0.55, 1.0, vig);

  col = clamp(col, 0.0, 1.0);
  col = pow(col, vec3(1.0/2.2));
  fragColor = vec4(col, 1.0);
}
</script>

<script>
"use strict";
/* ================================================================
   GARGANTUA — Interstellar 黑洞致敬
   史瓦西度规光子测地线光线追踪（GPU 逐像素 RK4）
   ================================================================ */

/* ---------- 画布与上下文 ---------- */
const canvas = document.getElementById("glcanvas");
const gl = canvas.getContext("webgl2", { antialias:false, depth:false, stencil:false,
  powerPreference:"high-performance", preserveDrawingBuffer:true });

const loader = document.getElementById("loader");
const errBox = document.getElementById("errmsg");
function fail(msg){
  errBox.style.display = "block";
  errBox.innerHTML = msg;
  document.querySelector("#loader .spin").style.display = "none";
  document.querySelector("#loader .txt").textContent = "";
}
if(!gl){ fail("你的浏览器不支持 WebGL2，无法运行本模拟。<br>请使用最新版 Chrome / Edge / Firefox。"); throw new Error("no webgl2"); }
if(!gl.getExtension("EXT_color_buffer_float")){
  fail("你的 GPU 不支持浮点渲染缓冲（EXT_color_buffer_float），无法运行 HDR 光线追踪。<br>请更新显卡驱动或更换浏览器。"); throw new Error("no float rt");
}

/* ---------- GL 工具 ---------- */
function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s);
    gl.deleteShader(s);
    throw new Error("shader compile: " + log);
  }
  return s;
}
function program(fsSrc){
  const vs = compile(gl.VERTEX_SHADER, "#version 300 es\n" +
    "void main(){\n" +
    "  vec2 p = vec2( (gl_VertexID==0)?-1.0:3.0, (gl_VertexID==2)?3.0:-1.0 );\n" +
    "  gl_Position = vec4(p, 0.0, 1.0);\n" +
    "}");
  const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
  gl.deleteShader(vs); gl.deleteShader(fs);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    throw new Error("program link: " + gl.getProgramInfoLog(p));
  }
  return p;
}
function makeTex(w, h){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function makeFB(tex){
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
    throw new Error("framebuffer incomplete");
  return fb;
}
function uniforms(p){
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  const map = {};
  for(let i=0;i<n;i++){
    const info = gl.getActiveUniform(p, i);
    map[info.name] = gl.getUniformLocation(p, info.name);
  }
  return map;
}
function bindTex(unit, loc, tex){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(loc, unit); }

/* ---------- GLSL 读取 ---------- */
const TRACE_FS_SRC     = document.getElementById("fs-trace").textContent.trim();
const BRIGHT_FS_SRC    = document.getElementById("fs-bright").textContent.trim();
const BLUR_FS_SRC      = document.getElementById("fs-blur").textContent.trim();
const COMPOSITE_FS_SRC = document.getElementById("fs-composite").textContent.trim();

/* ---------- passes ---------- */
let pTrace, pBright, pBlur, pComposite;
let uTrace, uBright, uBlur, uComposite;
function initPasses(){
  pTrace     = program(TRACE_FS_SRC);
  pBright    = program(BRIGHT_FS_SRC);
  pBlur      = program(BLUR_FS_SRC);
  pComposite = program(COMPOSITE_FS_SRC);
  uTrace = uniforms(pTrace); uBright = uniforms(pBright);
  uBlur = uniforms(pBlur);   uComposite = uniforms(pComposite);
}

/* ---------- 渲染目标 ---------- */
let IW = 0, IH = 0;            // 内部渲染尺寸
let sceneTex, accumTex, sceneFB, accumFB;
let bloomTexA, bloomTexB, bloomFBA, bloomFBB;
function initTargets(){
  if(sceneTex){ gl.deleteTexture(sceneTex); gl.deleteTexture(accumTex); }
  if(bloomTexA){ gl.deleteTexture(bloomTexA); gl.deleteTexture(bloomTexB); }
  if(sceneFB){ gl.deleteFramebuffer(sceneFB); gl.deleteFramebuffer(accumFB); }
  if(bloomFBA){ gl.deleteFramebuffer(bloomFBA); gl.deleteFramebuffer(bloomFBB); }
  const bw = Math.max(2, IW>>2), bh = Math.max(2, IH>>2);
  sceneTex = makeTex(IW,IH); accumTex = makeTex(IW,IH);
  sceneFB = makeFB(sceneTex); accumFB = makeFB(accumTex);
  bloomTexA = makeTex(bw,bh); bloomTexB = makeTex(bw,bh);
  bloomFBA = makeFB(bloomTexA); bloomFBB = makeFB(bloomTexB);
}

/* ---------- 相机状态 ---------- */
const cam = { theta: 1.12, phi: 0.55, r: 24.0 };   // 球坐标：theta 相对盘法向(y)，phi 方位角
const camTarget = { theta: 1.12, phi: 0.55, r: 24.0 }; // 平滑目标
const fovY = 55 * Math.PI/180;

/* ---------- 设置状态 ---------- */
const settings = {
  quality: 0.75,          // 内部渲染 scale
  doppler: 0.72,          // 多普勒强度（电影做了艺术化弱化）
  autoCinema: true,       // 自动运镜
  aaAccum: true,          // 时间累积抗锯齿
  debug: parseInt(new URLSearchParams(location.search).get("debug") || "0", 10) || 0,
};
let autoBase = { t: performance.now()*0.001, phi: 0.55, theta: 1.12, r: 24.0 };
let accFrames = 0;
let frameCount = 0;
let lastT = performance.now();

/* ---------- 输入 ---------- */
let dragging = false, lastPX = 0, lastPY = 0;
let pinchDist = 0;
const pointerPos = new Map();

function clampCam(){
  camTarget.theta = Math.min(1.2, Math.max(0.05, camTarget.theta));
  camTarget.r     = Math.min(60,  Math.max(7.6,  camTarget.r));
}
function rotateBy(dx, dy){
  camTarget.phi   -= dx * 0.0055;
  camTarget.theta -= dy * 0.0042;
  clampCam();
}
function zoomBy(f){
  camTarget.r = Math.min(60, Math.max(7.6, camTarget.r * f));
  bumpAccum();
}

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointerPos.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointerPos.size === 1){ dragging = true; lastPX = e.clientX; lastPY = e.clientY; document.body.classList.add("dragging"); }
  else if(pointerPos.size === 2){ dragging = false; document.body.classList.remove("dragging");
    const pts = [...pointerPos.values()]; pinchDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y); }
  if(settings.autoCinema){
    settings.autoCinema = false; syncAutoUI();
  }
  bumpAccum();
});
canvas.addEventListener("pointermove", e => {
  if(!pointerPos.has(e.pointerId)) return;
  pointerPos.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointerPos.size === 1 && dragging){
    rotateBy(e.clientX - lastPX, e.clientY - lastPY);
    lastPX = e.clientX; lastPY = e.clientY;
    bumpAccum();
  } else if(pointerPos.size === 2){
    const pts = [...pointerPos.values()];
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if(pinchDist > 0) zoomBy(pinchDist / d);
    pinchDist = d;
  }
});
function endPointer(e){
  pointerPos.delete(e.pointerId);
  if(pointerPos.size === 0){ dragging = false; document.body.classList.remove("dragging"); pinchDist = 0; }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  zoomBy(Math.exp(e.deltaY * 0.0012));
}, { passive:false });
canvas.addEventListener("dblclick", () => {
  settings.autoCinema = !settings.autoCinema;
  if(settings.autoCinema){
    autoBase = { t: performance.now()*0.001, phi: cam.phi, theta: cam.theta, r: cam.r };
  }
  syncAutoUI(); bumpAccum();
});

/* ---------- UI 绑定 ---------- */
const btnAuto = document.getElementById("btnAuto");
const btnAA   = document.getElementById("btnAA");
const segQ    = document.getElementById("segQ");
const doppler = document.getElementById("doppler");
const hint    = document.getElementById("hint");

function syncAutoUI(){ btnAuto.classList.toggle("on", settings.autoCinema); }
function syncAAUI(){ btnAA.classList.toggle("on", settings.aaAccum); }
btnAuto.addEventListener("click", () => {
  settings.autoCinema = !settings.autoCinema;
  if(settings.autoCinema)
    autoBase = { t: performance.now()*0.001, phi: cam.phi, theta: cam.theta, r: cam.r };
  syncAutoUI(); bumpAccum();
});
btnAA.addEventListener("click", () => {
  settings.aaAccum = !settings.aaAccum; syncAAUI(); bumpAccum();
});
segQ.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  settings.quality = parseFloat(b.dataset.q);
  [...segQ.children].forEach(x => x.classList.toggle("on", x === b));
  resize();
});
doppler.addEventListener("input", () => { settings.doppler = parseFloat(doppler.value); });
const btnReset = document.getElementById("btnReset");
function resetView(){
  camTarget.theta = 1.12; camTarget.phi = 0.55; camTarget.r = 24.0;
  if(settings.autoCinema){
    settings.autoCinema = false; syncAutoUI();
  }
  bumpAccum();
}
btnReset.addEventListener("click", resetView);
window.addEventListener("keydown", e => {
  if(e.key === "r" || e.key === "R") resetView();
});

/* ---------- 累积控制 ---------- */
function bumpAccum(){
  accFrames = 0;
  hint.classList.remove("hidden");
  clearTimeout(hint._t);
  hint._t = setTimeout(() => hint.classList.add("hidden"), 4000);
}

/* ---------- resize ---------- */
let cssW = 1, cssH = 1;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = Math.max(1, Math.floor(canvas.clientWidth));
  cssH = Math.max(1, Math.floor(canvas.clientHeight));
  IW = Math.max(2, Math.floor(cssW * dpr * settings.quality));
  IH = Math.max(2, Math.floor(cssH * dpr * settings.quality));
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  initTargets();
  bumpAccum();
}
window.addEventListener("resize", resize);

/* ---------- Halton ---------- */
function halton(i, base){
  let f = 1, r = 0;
  while(i > 0){ f /= base; r += f * (i % base); i = Math.floor(i / base); }
  return r;
}

/* ---------- 相机基 ---------- */
const camPos = [0,0,0], camRight = [0,0,0], camUp = [0,0,0], camFwd = [0,0,0];
function updateCamera(dt){
  if(settings.autoCinema){
    const t = performance.now()*0.001 - autoBase.t;
    camTarget.phi   = autoBase.phi   + t * 0.042;
    camTarget.theta = autoBase.theta + 0.045 * Math.sin(t * 0.11);
    camTarget.r     = autoBase.r     + 1.7 * Math.sin(t * 0.063);
  }
  const k = 1 - Math.exp(-dt * 6.5);
  cam.theta += (camTarget.theta - cam.theta) * k;
  cam.phi   += (camTarget.phi   - cam.phi  ) * k;
  cam.r     += (camTarget.r     - cam.r    ) * k;
  if(settings.autoCinema) accFrames = 0;

  const st = Math.sin(cam.theta), ct = Math.cos(cam.theta);
  const sp = Math.sin(cam.phi),   cp = Math.cos(cam.phi);
  camPos[0] = cam.r * st * cp;
  camPos[1] = cam.r * ct;
  camPos[2] = cam.r * st * sp;
  camFwd[0] = -camPos[0]; camFwd[1] = -camPos[1]; camFwd[2] = -camPos[2];
  const fl = Math.hypot(camFwd[0], camFwd[1], camFwd[2]);
  camFwd[0]/=fl; camFwd[1]/=fl; camFwd[2]/=fl;
  // right = normalize(cross(fwd, upWorld))；upWorld 带固定横滚使盘面倾斜（电影构图）
  let ux = 0.25, uy = 1.0, uz = 0.0;
  const ul = Math.hypot(ux, uy, uz);
  ux/=ul; uy/=ul; uz/=ul;
  let rx = camFwd[1]*uz - camFwd[2]*uy;
  let ry = camFwd[2]*ux - camFwd[0]*uz;
  let rz = camFwd[0]*uy - camFwd[1]*ux;
  const rl = Math.hypot(rx, ry, rz) || 1;
  rx/=rl; ry/=rl; rz/=rl;
  camRight[0]=rx; camRight[1]=ry; camRight[2]=rz;
  // up = cross(right, fwd)
  camUp[0] = camRight[1]*camFwd[2]-camRight[2]*camFwd[1];
  camUp[1] = camRight[2]*camFwd[0]-camRight[0]*camFwd[2];
  camUp[2] = camRight[0]*camFwd[1]-camRight[1]*camFwd[0];
}

/* ---------- 渲染 ---------- */
function setViewport(w,h){ gl.viewport(0,0,w,h); }

function render(){
  frameCount++;
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastT)/1000);
  lastT = now;
  updateCamera(dt);

  // 累积系数：静止且开启时渐进混合
  const accumulating = settings.aaAccum && !dragging
    && Math.abs(cam.r-camTarget.r)<0.01
    && Math.abs(cam.theta-camTarget.theta)<0.002
    && Math.abs(cam.phi-camTarget.phi)<0.002
    && !settings.autoCinema;
  if(!accumulating) accFrames = 0; else accFrames = Math.min(accFrames+1, 72);
  const blend = accumulating ? 1/(accFrames+1) : 1;

  const aspect = IW / IH;
  const tanHalf = Math.tan(fovY*0.5);
  const jitterX = accumulating ? (halton(accFrames,2)-0.5)/IW : 0;
  const jitterY = accumulating ? (halton(accFrames,3)-0.5)/IH : 0;

  /* ---- 1. 场景光线追踪 ---- */
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, accumFB);
  setViewport(IW,IH);
  gl.useProgram(pTrace);
  gl.uniform2f(uTrace.uResolution, IW, IH);
  gl.uniform3fv(uTrace.uCamPos, camPos);
  gl.uniform3fv(uTrace.uCamRight, camRight);
  gl.uniform3fv(uTrace.uCamUp, camUp);
  gl.uniform3fv(uTrace.uCamFwd, camFwd);
  gl.uniform1f(uTrace.uTanHalfFov, tanHalf);
  gl.uniform1f(uTrace.uAspect, aspect);
  gl.uniform1f(uTrace.uTime, now*0.001);
  gl.uniform1f(uTrace.uDoppler, settings.doppler);
  gl.uniform2f(uTrace.uJitter, jitterX, jitterY);
  gl.uniform1f(uTrace.uBlend, blend);
  gl.uniform1f(uTrace.uDebug, settings.debug);
  bindTex(0, uTrace.uPrev, sceneTex);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  { const t = sceneTex; sceneTex = accumTex; accumTex = t;
    const f = sceneFB; sceneFB = accumFB; accumFB = f; }

  /* ---- 2. bloom：亮部提取 ---- */
  const bw = Math.max(2, IW>>2), bh = Math.max(2, IH>>2);
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBA);
  setViewport(bw,bh);
  gl.useProgram(pBright);
  bindTex(0, uBright.uScene, sceneTex);
  gl.uniform2f(uBright.uRes, bw, bh);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* ---- 3. bloom：高斯模糊（H+V） ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBB);
  gl.useProgram(pBlur);
  bindTex(0, uBlur.uTex, bloomTexA);
  gl.uniform2f(uBlur.uDir, 1, 0);
  gl.uniform2f(uBlur.uRes, bw, bh);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFBA);
  bindTex(0, uBlur.uTex, bloomTexB);
  gl.uniform2f(uBlur.uDir, 0, 1);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* ---- 4. 合成到屏幕 ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  setViewport(canvas.width, canvas.height);
  gl.useProgram(pComposite);
  bindTex(0, uComposite.uScene, sceneTex);
  bindTex(1, uComposite.uBloom, bloomTexA);
  gl.uniform2f(uComposite.uRes, canvas.width, canvas.height);
  gl.uniform2f(uComposite.uSceneRes, IW, IH);
  gl.uniform1f(uComposite.uTime, now*0.001);
  gl.uniform1f(uComposite.uFrame, frameCount);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function loop(){
  render();
  requestAnimationFrame(loop);
}

/* ---------- 启动 ---------- */
try{
  initPasses();
  resize();
  loop();
  setTimeout(() => loader.classList.add("gone"), 900);
}catch(err){
  console.error(err);
  fail("着色器初始化失败：<br>" + String(err.message).slice(0, 300).replace(/</g,"&lt;"));
}
</script>
</body>
